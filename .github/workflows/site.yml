name: Website and store listing

on:
  push:
    branches: [main]
    paths: ["site/**", "branding/**", "store/**", "tools/store/**", ".github/workflows/site.yml"]
  pull_request:
    paths: ["site/**", "branding/**", "store/**", "tools/store/**", ".github/workflows/site.yml"]

jobs:
  generated:
    name: site/public is what site/generate.py makes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 site/generate.py --check

  store:
    name: store/play is within Play's limits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/store/play.py check

