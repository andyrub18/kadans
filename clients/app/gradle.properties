kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
android.nonTransitiveRClass=true
android.useAndroidX=true

# The version every app shows and reports (Android's versionName, the desktop package, the update check): one number
# for all. A release passes its own (-Pkadans.version=1.1.0, from the tag); Android's versionCode is separate.
kadans.version=1.0.0
