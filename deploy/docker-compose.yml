# Kadans on one machine: nginx (HTTPS, certificates by certbot) → API → Postgres, plus a nightly database dump, and the
# monitoring (Prometheus, Loki, Grafana, node-exporter: docs/ARCHITECTURE.md → Observability).
# Everything host-specific lives in .env (copy .env.example). Guide: docs/DEPLOYMENT.md
#
#   docker compose up -d --build        first start, and every update after `git pull`
#   docker compose logs -f api
#   ssh -L 3000:127.0.0.1:3000 <you>@<server>   then http://localhost:3000: Grafana, never on the internet
name: kadans

# Docker keeps container logs forever by default. Capped at 5 × 10 MB per service, a flood of requests (and the
# rate limiter's warnings about it) cannot fill the disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  # The proxy (docs/DEPLOYMENT.md → Proxy and certificates): TLS, gzip, WebSockets, HTTP to HTTPS. nginx took half of
  # Caddy's CPU for the same work (docs/LOADTEST.md); certbot gets and renews the certificate, nginx picks it up.
  nginx:
    image: nginx:1.30
    restart: unless-stopped
    logging: *logging
    ports:
      - "80:80"
      - "443:443"
    environment:
      KADANS_DOMAIN: ${KADANS_DOMAIN:?set KADANS_DOMAIN in .env, e.g. api.kadansplanning.com}
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/https.conf.template:/etc/nginx/kadans/https.conf.template:ro
      - ./nginx/40-kadans-certificate.sh:/docker-entrypoint.d/40-kadans-certificate.sh:ro
      - letsencrypt:/etc/letsencrypt:ro
      - acme_challenges:/var/www/acme:ro
    depends_on:
      - api

  certbot:
    image: certbot/certbot:v5.8.0
    restart: unless-stopped
    logging: *logging
    entrypoint: ["/bin/sh", "/kadans/certbot.sh"]
    environment:
      KADANS_DOMAIN: ${KADANS_DOMAIN:?}
    volumes:
      - ./nginx/certbot.sh:/kadans/certbot.sh:ro
      - letsencrypt:/etc/letsencrypt # the certificate and the Let's Encrypt account: keep this volume (rate limits)
      - acme_challenges:/var/www/acme
      - backup_metrics:/metrics # the certificate's expiry, for node-exporter: an alert fires 14 days before it
    depends_on:
      - nginx

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *logging
    # Exactly one instance, by design: the scheduler, the pomodoro deadline watcher, the push queue and
    # SignalR all live in this process. Never scale this service.
    environment:
      # GSS Encryption Mode=Disable: the database is on the private compose network; without it Npgsql probes
      # for Kerberos and logs "Cannot load library libgssapi_krb5.so.2" (harmless, but it looks like an error).
      ConnectionStrings__kadans: Host=db;Database=kadans;Username=kadans;Password=${POSTGRES_PASSWORD:?};GSS Encryption Mode=Disable
      Jwt__Key: ${JWT_KEY:?}
      Email__Provider: ${EMAIL_PROVIDER:-Resend}
      Email__Resend__ApiKey: ${RESEND_API_KEY:-}
      Email__From: ${EMAIL_FROM:?e.g. Kadans <no-reply@kadansplanning.com>}
      # Emailed links (confirm email, reset password, confirm a new email) open pages the API serves.
      Email__LinkBaseUrl: https://${KADANS_DOMAIN}
      Push__Provider: ${PUSH_PROVIDER:-Fcm}
      Push__Firebase__CredentialsFile: /run/secrets/firebase-admin.json
      ExternalAuth__Google__Desktop__ClientId: ${GOOGLE_DESKTOP_CLIENT_ID:-}
      ExternalAuth__Google__Desktop__ClientSecret: ${GOOGLE_DESKTOP_CLIENT_SECRET:-}
      ExternalAuth__Google__WebClientId: ${GOOGLE_WEB_CLIENT_ID:-}
      InitialAdmin__Enabled: ${INITIAL_ADMIN_ENABLED:-false}
      InitialAdmin__Username: ${INITIAL_ADMIN_USERNAME:-admin}
      InitialAdmin__Email: ${INITIAL_ADMIN_EMAIL:-}
      InitialAdmin__Password: ${INITIAL_ADMIN_PASSWORD:-}
      # Subscriptions (docs/DEPLOYMENT.md → Subscriptions): off until the Play product is live.
      Billing__Required: ${BILLING_REQUIRED:-false}
      Billing__Google__ServiceAccountFile: ${PLAY_SERVICE_ACCOUNT_FILE:-}
      Billing__Google__NotificationAudience: https://${KADANS_DOMAIN}/billing/google/notifications
      Billing__Google__NotificationServiceAccount: ${PLAY_NOTIFICATIONS_SERVICE_ACCOUNT:-}
      # Monitoring, inside the compose network: metrics to Prometheus, logs to Loki (both OTLP).
      Telemetry__MetricsEndpoint: http://prometheus:9090/api/v1/otlp/v1/metrics
      Telemetry__LogsEndpoint: http://loki:3100/otlp/v1/logs
    volumes:
      # The whole folder, read-only: firebase-admin.json (must exist before the first `up`), and the Play key once
      # subscriptions are on. A folder, so a key not there yet never becomes an empty directory.
      - ./secrets:/run/secrets:ro
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    restart: unless-stopped
    logging: *logging
    # Sized for this server (2 vCPU, 4 GB, SSD) by the load test (docs/LOADTEST.md): a quarter of the memory for
    # Postgres' cache, SSD-priced random reads, no JIT (it slowed the short queries an app makes). pg_stat_statements
    # names the costliest queries (DEPLOYMENT → Monitoring); it keeps query shapes, never their values.
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - random_page_cost=1.1
      - -c
      - jit=off
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - shared_preload_libraries=pg_stat_statements
    # Docker's 64 MB /dev/shm is too small for Postgres' shared memory at this size.
    shm_size: 256mb
    environment:
      POSTGRES_DB: kadans
      POSTGRES_USER: kadans
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kadans -d kadans"]
      interval: 5s
      timeout: 3s
      retries: 20
    # No published port: only the API can reach the database.

  backup:
    image: postgres:17
    restart: unless-stopped
    logging: *logging
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - ./backups:/backups
      - backup_metrics:/metrics # read by node-exporter: an alert fires when no dump was written for a day
    depends_on:
      db:
        condition: service_healthy
    # One compressed dump a day, two weeks kept. --clean: a restore replaces what is there. A dump on the same disk survives a bad migration, not a
    # dead server: copy ./backups somewhere else (docs/DEPLOYMENT.md → Backups).
    entrypoint:
      - /bin/sh
      - -c
      - |
        while true; do
          file="/backups/kadans-$$(date -u +%Y%m%d-%H%M%S).sql.gz"
          if pg_dump --clean --if-exists -h db -U kadans -d kadans | gzip > "$$file.tmp"; then
            mv "$$file.tmp" "$$file"; echo "backup written: $$file"
            printf '# TYPE kadans_backup_last_success_timestamp_seconds gauge\nkadans_backup_last_success_timestamp_seconds %s\n# TYPE kadans_backup_last_size_bytes gauge\nkadans_backup_last_size_bytes %s\n' "$$(date +%s)" "$$(stat -c %s "$$file")" > /metrics/backup.prom.tmp && mv /metrics/backup.prom.tmp /metrics/backup.prom
          else rm -f "$$file.tmp"; echo "backup FAILED"; fi
          find /backups -name 'kadans-*.sql.gz' -mtime +14 -delete
          sleep 86400
        done

  # ---- Monitoring (docs/ARCHITECTURE.md → Observability). Nothing here is published to the internet: Grafana listens
  # on the server's loopback only (an SSH tunnel reaches it), the rest only on the compose network. Memory is capped
  # so monitoring can never starve the API or the database. All three are Go programs: GOMEMLIMIT makes their garbage
  # collector work harder as they near the cap, instead of growing until the kernel kills them.
  prometheus:
    image: prom/prometheus:v3.15.0
    restart: unless-stopped
    logging: *logging
    mem_limit: 512m
    environment:
      GOMEMLIMIT: 400MiB
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=2GB
      - --web.enable-otlp-receiver
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus:/prometheus

  loki:
    image: grafana/loki:3.7.8
    restart: unless-stopped
    logging: *logging
    mem_limit: 512m
    environment:
      GOMEMLIMIT: 400MiB
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ./observability/loki.yml:/etc/loki/config.yml:ro
      - loki:/loki

  grafana:
    image: grafana/grafana:13.2.3
    restart: unless-stopped
    logging: *logging
    # Measured: about 250 MB idle, 590 MB at most with three browsers opening the dashboard at once (with the collector
    # at 512 MiB). At 256 MB, opening the dashboard got it killed.
    mem_limit: 768m
    ports:
      - "127.0.0.1:3000:3000" # loopback only: ssh -L 3000:127.0.0.1:3000 <you>@<server>
    environment:
      GOMEMLIMIT: 512MiB
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_SERVER_ROOT_URL: http://localhost:3000
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true" # nothing downloaded behind our back: the two data sources are built in
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/kadans.json # signing in lands on it
      # Alerts by email, through Resend's SMTP with the API key Kadans already sends with.
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: smtp.resend.com:587
      GF_SMTP_USER: resend
      GF_SMTP_PASSWORD: ${RESEND_API_KEY:?}
      GF_SMTP_STARTTLS_POLICY: MandatoryStartTLS
      GF_SMTP_FROM_ADDRESS: ${ALERT_FROM_ADDRESS:-alerts@kadansplanning.com}
      GF_SMTP_FROM_NAME: Kadans alerts
      ALERT_EMAIL: ${ALERT_EMAIL:?set ALERT_EMAIL in .env, where alerts go}
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana:/var/lib/grafana
    depends_on:
      - prometheus
      - loki

  # The server itself: CPU, memory, disk, and the backup's last success (textfile collector).
  node-exporter:
    image: prom/node-exporter:v1.12.1
    restart: unless-stopped
    logging: *logging
    mem_limit: 64m
    pid: host
    command:
      - --path.rootfs=/host
      - --collector.textfile.directory=/textfile
    volumes:
      - /:/host:ro,rslave
      - backup_metrics:/textfile:ro # the backup's and the certificate's metrics

volumes:
  pgdata:
  letsencrypt:
  acme_challenges:
  prometheus:
  loki:
  grafana:
  backup_metrics:
