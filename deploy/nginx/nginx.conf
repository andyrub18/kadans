# nginx's main configuration: the image's own, with room for every open app and no access log
# (docs/DEPLOYMENT.md → Proxy and certificates).
user  nginx;
worker_processes  auto;

# Each open app holds a connection, and nginx a second one to the API. The image's 1,024 connections per worker (and
# 1,024 open files) refused new ones past about 1,000 open apps in the load test (docs/LOADTEST.md, run 6).
worker_rlimit_nofile 65536;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;

events {
    worker_connections  16384;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Requests are the API's metrics' job (ARCHITECTURE → Observability): a line per request would cost CPU and fill
    # Docker's log quota. Errors still go to the error log.
    access_log  off;

    sendfile        on;
    keepalive_timeout  65;

    include /etc/nginx/conf.d/*.conf;
}
