# The monitoring stack on a development machine, for the API run with `dotnet run` (its Development settings push
# here). Same configuration files as production, ports on localhost only, Grafana without a login, and alert emails
# caught by Mailpit instead of sent.
#
#   docker compose -f deploy/observability/compose.dev.yml up -d      Grafana: http://localhost:3000
#                                                                     alert emails: http://localhost:8025
#   docker compose -f deploy/observability/compose.dev.yml down -v    (-v also forgets the data)
name: kadans-observability-dev

services:
  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-otlp-receiver
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus:/prometheus

  loki:
    image: grafana/loki:3.7.8
    command: -config.file=/etc/loki/config.yml
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./loki.yml:/etc/loki/config.yml:ro
      - loki:/loki

  grafana:
    image: grafana/grafana:13.2.3
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true" # nothing downloaded behind our back: the two data sources are built in
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: mailpit:1025
      GF_SMTP_STARTTLS_POLICY: NoStartTLS
      GF_SMTP_FROM_ADDRESS: alerts@example.com
      GF_SMTP_FROM_NAME: Kadans alerts
      ALERT_EMAIL: dev@example.com
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana:/var/lib/grafana

  mailpit:
    image: axllent/mailpit:v1.31.4
    ports:
      - "127.0.0.1:8025:8025"

volumes:
  prometheus:
  loki:
  grafana:
