# Loki for Kadans, one process on the local disk (docs/ARCHITECTURE.md → Observability). The API pushes its logs over
# OTLP to /otlp; each event's properties become structured metadata. Kept 30 days.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2026-10-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 30d
  allow_structured_metadata: true
  volume_enabled: true

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

querier:
  # A small server: a heavy query must not take every core from the API and the database.
  max_concurrent: 2

pattern_ingester:
  enabled: false

analytics:
  reporting_enabled: false
