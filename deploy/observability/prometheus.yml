# Prometheus for Kadans (docs/ARCHITECTURE.md → Observability). The API pushes its metrics over OTLP
# (--web.enable-otlp-receiver); the server's own metrics are scraped from node-exporter. Alerts live in Grafana.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

storage:
  tsdb:
    # OTLP pushes can arrive slightly out of order; Prometheus recommends a window for them.
    out_of_order_time_window: 30m

scrape_configs:
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
